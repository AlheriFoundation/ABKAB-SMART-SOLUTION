  <!-- stat cards -->
  <rect x="270" y="86" width="120" height="70" rx="8" fill="#e3f4ff"/>
  <rect x="410" y="86" width="120" height="70" rx="8" fill="#e3f4ff"/>
  <rect x="550" y="86" width="120" height="70" rx="8" fill="#e3f4ff"/>
