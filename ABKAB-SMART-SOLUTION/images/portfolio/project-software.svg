<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#eefaff"/>
  <!-- dashboard window -->
  <rect x="100" y="50" width="600" height="350" rx="14" fill="#ffffff" stroke="#cfe8f7"/>
  <rect x="100" y="50" width="140" height="350" rx="14" fill="#0b3a5b"/>
  <rect x="124" y="86" width="92" height="12" rx="6" fill="#7fd1ff"/>
  <rect x="124" y="120" width="92" height="10" rx="5" fill="#3a6b8f"/>
  <rect x="124" y="146" width="92" height="10" rx="5" fill="#3a6b8f"/>
