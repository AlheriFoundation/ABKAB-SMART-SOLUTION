  <rect x="356" y="196" width="12" height="8" rx="2" fill="#a7f3c0"/>
  <rect x="376" y="196" width="12" height="8" rx="2" fill="#a7f3c0"/>
  <rect x="396" y="196" width="12" height="8" rx="2" fill="#a7f3c0"/>
  <rect x="416" y="196" width="12" height="8" rx="2" fill="#a7f3c0"/>
  <text x="400" y="235" text-anchor="middle" fill="#fff" font-family="Poppins, Arial" font-size="14" font-weight="700">SWITCH</text>
  <!-- connections -->
