<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | ABKAB Smart Solution</title><link rel="icon" href="images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="css/style.css"></head><body>
<main id="main-content" class="admin-shell"><div class="container"><div class="admin-header"><img class="brand-logo-image" src="images/logo.svg" alt="ABKAB Smart Solution"><button id="logoutButton" class="btn btn-secondary" hidden>Log out</button></div><section id="loginPanel" class="contact-form portal-narrow"><div class="section-heading"><span class="eyebrow">Restricted access</span><h1>Admin sign in</h1></div><form id="loginForm"><div class="form-grid"><div class="field full"><label for="adminEmail">Email</label><input id="adminEmail" type="email" required autocomplete="username"></div><div class="field full"><label for="adminPassword">Password</label><input id="adminPassword" type="password" required autocomplete="current-password"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Sign in</button></div><p id="loginStatus" class="form-status" role="status"></p></form></section><section id="dashboard" hidden><div class="admin-title"><div><span class="eyebrow">Operations</span><h1>Request dashboard</h1></div><button id="refreshButton" class="btn btn-secondary">Refresh</button></div><div id="stats" class="admin-stats"></div><div class="admin-filters"><input id="requestSearch" type="search" placeholder="Search tracking number, name, phone or email"><select id="statusFilter"><option value="">All statuses</option><option value="PENDING">Pending</option><option value="UNDER_REVIEW">Under Review</option><option value="PROCESSING">Processing</option><option value="APPROVED">Approved</option><option value="COMPLETED">Completed</option><option value="REJECTED">Rejected</option><option value="CANCELLED">Cancelled</option></select><select id="sortOrder"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div><div id="requestList" class="admin-list"></div><p id="adminStatus" class="form-status" role="status"></p></section></div></main><script src="js/admin.js"></script></body></html>
