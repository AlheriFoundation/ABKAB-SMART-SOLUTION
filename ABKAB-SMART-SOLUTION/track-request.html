<main id="main-content"><section class="page-hero"><div class="container section-heading"><span class="eyebrow">Customer portal</span><h1>Track your request</h1><p>Enter the Request ID from your confirmation and the email address used when you submitted it.</p></div></section>
<section class="section"><div class="container portal-narrow"><form id="trackingForm" class="contact-form"><div class="form-grid"><div class="field full"><label for="trackingId">Request ID</label><input id="trackingId" required placeholder="ABKAB-2026-ABC123" autocomplete="off"></div><div class="field full"><label for="trackingEmail">Email Address</label><input id="trackingEmail" type="email" required autocomplete="email"></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Check Status <i class="fas fa-arrow-right"></i></button></div><p id="trackingStatus" class="form-status" role="status" aria-live="polite"></p></form><section id="trackingResult" class="request-result" hidden aria-live="polite"><h2>Request status</h2><dl><div><dt>Request ID</dt><dd id="resultId"></dd></div><div><dt>Service</dt><dd id="resultService"></dd></div><div><dt>Status</dt><dd id="resultStatus"></dd></div><div><dt>Date Submitted</dt><dd id="resultCreated"></dd></div><div><dt>Last Updated</dt><dd id="resultUpdated"></dd></div></dl></section></div></section></main>
<script src="js/track-request.js"></script></body></html>
